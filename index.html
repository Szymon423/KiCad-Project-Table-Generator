<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Generate a title-block style table with a logo for a KiCad PCB, as a PNG or SVG sized in millimetres." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>KiCad Project Table Generator</title>
  </head>
  <body>
    <aside id="panel">
      <section>
        <h2>Rows</h2>
        <div id="rows"></div>
        <button id="add-row" class="wide">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
          Add row
        </button>
      </section>

      <section>
        <h2>Logo</h2>
        <div id="logo">
          <div id="logo-thumb"></div>
          <span id="logo-name"></span>
          <button id="logo-pick">Choose…</button>
          <button id="logo-remove" title="Remove the logo" aria-label="Remove the logo"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
        </div>
        <div class="field">Rotation
          <span>
            <span id="logo-rotation"></span>
            <button id="logo-rotate" class="logo-only" title="Turn the logo 90° clockwise">
              <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.500 9.500A5.500 5.500 0 1110 4.500h4"/><path d="M11.500 2l2.500 2.500L11.500 7"/></svg>
              90°
            </button>
          </span>
        </div>
        <label class="field" title="Swap the logo's light and dark, without touching the rest of the table">Invert logo <input type="checkbox" id="invert-logo" class="logo-only" /></label>
        <label class="field" title="Cut away the transparent or white border the logo file comes with">Trim empty edges <input type="checkbox" id="trim-logo" /></label>
        <label class="field">Logo padding <span><input type="number" data-field="logoPadding" min="0" max="20" step="0.1" /> mm</span></label>
      </section>

      <section>
        <h2>Text</h2>
        <label class="field">Font
          <span>
            <select id="font"></select>
            <button id="font-pick" title="Use a font file from your computer (TTF, OTF or WOFF)">Load…</button>
          </span>
        </label>
        <label class="field">Letter height <span><input type="number" data-field="textHeight" min="0.3" max="50" step="0.1" /> mm</span></label>
        <label class="field">Text padding <span><input type="number" data-field="padding" min="0" max="20" step="0.1" /> mm</span></label>
        <div class="field">Alignment
          <span class="segmented" id="align">
            <button data-align="left">Left</button>
            <button data-align="center">Centre</button>
          </span>
        </div>
      </section>

      <section>
        <h2>Table</h2>
        <label class="field">Line width <span><input type="number" data-field="lineWidth" min="0.05" max="5" step="0.05" /> mm</span></label>
        <label class="field">Inverted (white on black) <input type="checkbox" id="invert" /></label>
      </section>

      <section>
        <h2>Output</h2>
        <div class="field">Size
          <span class="segmented" id="size-by">
            <button data-size-by="settings" title="The table is as large as the lengths above make it">As set</button>
            <button data-size-by="height" title="The whole table is scaled to a height you choose">Fixed height</button>
          </span>
        </div>
        <label class="field" id="height-field">Table height <span><input type="number" data-field="height" min="1" max="500" step="0.1" /> mm</span></label>
        <p class="hint" id="scale-hint"></p>
        <label class="field">Resolution <span><input type="number" data-field="dpi" min="100" max="2400" step="100" /> dpi</span></label>
      </section>
    </aside>

    <main id="preview">
      <canvas id="canvas"></canvas>
    </main>

    <div id="toolbar">
      <button id="open" title="Open a saved project (Ctrl+O)" aria-label="Open a saved project"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15.500V5.500A1.500 1.500 0 014.500 4H8l2 2h5.500A1.500 1.500 0 0117 7.500v8A1.500 1.500 0 0115.500 17h-11A1.500 1.500 0 013 15.500z"/></svg></button>
      <div id="output" class="menu">
        <button id="output-button" title="Copy, export or save" aria-label="Copy, export or save" aria-haspopup="menu"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg></button>
        <div class="menu-items" role="menu">
          <button role="menuitem" data-output="kicad">Copy as KiCad footprint <kbd>Ctrl+K</kbd></button>
          <button role="menuitem" data-output="copy">Copy image <kbd>Ctrl+C</kbd></button>
          <hr />
          <button role="menuitem" data-output="footprint">Export as KiCad footprint</button>
          <button role="menuitem" data-output="png">Export as PNG <kbd>Ctrl+E</kbd></button>
          <button role="menuitem" data-output="svg">Export as SVG</button>
          <hr />
          <button role="menuitem" data-output="save">Save editable project <kbd>Ctrl+S</kbd></button>
        </div>
      </div>
      <hr />
      <button id="reset" title="Reset everything to the defaults" aria-label="Reset everything"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </div>

    <div id="size"></div>
    <div id="status" hidden></div>

    <dialog id="confirm" class="choice">
      <p></p>
      <div>
        <button value="cancel" autofocus>Cancel</button>
        <button value="ok" class="primary"></button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
